services:
  - type: web
    name: nize-logistics-api
    env: node
    region: frankfurt
    plan: free
    # The migration runs on every deploy. It is idempotent — every statement is
    # IF NOT EXISTS / IF EXISTS guarded and nothing is dropped — so running it
    # repeatedly is safe. It must run before the app starts, because the code
    # selects columns the base schema does not have.
    buildCommand: npm install && npm run migrate
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      # Optional: point at a self-hosted OSRM instance when the public demo
      # server is not good enough. Unset means the public demo is used.
      - key: OSRM_URL
        sync: false
      # Email delivery. Choose one provider:
      #   smtp    -> Mailjet (current default). Needs SMTP_HOST/PORT/USER/PASS.
      #   resend  -> Resend. Needs RESEND_API_KEY.
      # Switch by changing this value (and having that provider's keys set).
      - key: EMAIL_SERVICE
        value: smtp
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: Nize Logistics <noreply@nizelogistics.com>
      # Mailjet SMTP. HOST/PORT default to these values in code but are declared
      # for clarity. USER/PASS are secrets: sync:false means the real values live
      # in Render's Environment (Secret Store), NOT in this file. Set them in the
      # Render dashboard (Environment tab), or hand over a Render API key and the
      # values get set programmatically instead.
      - key: SMTP_HOST
        value: smtp.mailjet.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      # Package photo uploads.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Web push notifications to riders.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
    healthCheckPath: /health
